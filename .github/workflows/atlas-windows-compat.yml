name: Atlas compatibility regression
on:
  pull_request:
    paths:
      - '.agents/skills/system-atlas/**'
      - '.github/workflows/atlas-windows-compat.yml'
jobs:
  atlas:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .agents/skills/system-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .agents/skills/system-atlas/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test test/atomic-write.test.mjs
      - run: npm test
