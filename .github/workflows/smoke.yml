name: Reproducible demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.15'
      - run: uv sync --locked
      - run: uv run python src/demo.py
      - run: uv run python -m unittest discover -s .agents/skills/team-mailbox/tests
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-${{ matrix.os }}
          path: |
            results/demo/
            figures/demo/
          if-no-files-found: error
