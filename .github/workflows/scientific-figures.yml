name: Scientific figures
on:
  push:
    paths:
      - '.agents/skills/scientific-figures/**'
      - '.github/workflows/scientific-figures.yml'
  pull_request:
    paths:
      - '.agents/skills/scientific-figures/**'
      - '.github/workflows/scientific-figures.yml'
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --prefix .agents/skills/scientific-figures
      - run: npm test --prefix .agents/skills/scientific-figures
